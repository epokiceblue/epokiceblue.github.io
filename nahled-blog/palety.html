<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#ECE6DB;font-family:Poppins,sans-serif;color:#555}
.palety{display:grid;grid-template-columns:1fr 1fr;gap:2px;max-width:900px;margin:40px auto;background:#d6cbbb;border:1px solid #d6cbbb}
.paleta-sezona{background:#ECE6DB;padding:34px 36px 30px}
.paleta-sezona h4{margin:0 0 20px;font-size:24px;font-weight:700;color:#000;text-transform:lowercase}
.barvy{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 14px}
.barva span{display:block;aspect-ratio:1/1;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.barva small{display:block;font-size:12.5px;font-style:italic;margin-top:6px;color:#6b6157}
.podpis{grid-column:1/-1;background:#ECE6DB;text-align:right;font-size:11px;color:#9c9184;padding:8px 14px;letter-spacing:.04em}
@media(max-width:700px){.palety{grid-template-columns:1fr}.paleta-sezona{padding:26px 20px}}
</style></head><body>
<div class="palety">
<div class="paleta-sezona"><h4>jaro</h4><div class="barvy">
<div class="barva"><span style="background:#F4F0E8"></span><small>smetanová</small></div>
<div class="barva"><span style="background:#B9C8D4"></span><small>prachově modrá</small></div>
<div class="barva"><span style="background:#C4D0B6"></span><small>šalvějová</small></div>
<div class="barva"><span style="background:#E2B39D"></span><small>broskvová</small></div>
<div class="barva"><span style="background:#EEDFAE"></span><small>máslová</small></div>
<div class="barva"><span style="background:#D8CDBD"></span><small>písková</small></div></div></div>
<div class="paleta-sezona"><h4>léto</h4><div class="barvy">
<div class="barva"><span style="background:#FAF8F3"></span><small>bílá</small></div>
<div class="barva"><span style="background:#DACFBF"></span><small>lněná</small></div>
<div class="barva"><span style="background:#B5776E"></span><small>pudrově růžová</small></div>
<div class="barva"><span style="background:#C4B5CC"></span><small>levandulová</small></div>
<div class="barva"><span style="background:#AFC2D1"></span><small>nebesky modrá</small></div>
<div class="barva"><span style="background:#34495E"></span><small>námořnická</small></div></div></div>
<div class="paleta-sezona"><h4>podzim</h4><div class="barvy">
<div class="barva"><span style="background:#D5CAB7"></span><small>ovesná</small></div>
<div class="barva"><span style="background:#3B5248"></span><small>lahvově zelená</small></div>
<div class="barva"><span style="background:#6F8CA0"></span><small>kouřově modrá</small></div>
<div class="barva"><span style="background:#C39A48"></span><small>hořčicová</small></div>
<div class="barva"><span style="background:#A35E45"></span><small>rezavá</small></div>
<div class="barva"><span style="background:#5E4335"></span><small>čokoládová</small></div></div></div>
<div class="paleta-sezona"><h4>zima</h4><div class="barvy">
<div class="barva"><span style="background:#D9D7D3"></span><small>světle šedá</small></div>
<div class="barva"><span style="background:#B8A48E"></span><small>velbloudí</small></div>
<div class="barva"><span style="background:#8F9A8A"></span><small>šedozelená</small></div>
<div class="barva"><span style="background:#5B4336"></span><small>kaštanová</small></div>
<div class="barva"><span style="background:#6B2630"></span><small>vínová</small></div>
<div class="barva"><span style="background:#2F4459"></span><small>půlnočně modrá</small></div></div></div>
<div class="podpis">sofiezborilova.cz</div>
</div></body></html>
